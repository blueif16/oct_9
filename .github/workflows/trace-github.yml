# Sends PR, CI and push/merge events to ClickHouse (agent_traces.events).
# Commits carry an `Agent-Session:` trailer, so these rows join back to the agent session that wrote the code.
name: Trace GitHub events

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_run:
    # List the CI workflows to trace by name; must not include this workflow.
    workflows: [CI, Semgrep]
    types: [completed]

permissions:
  contents: read
  actions: read   # download the finished Semgrep run's results artifacts

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tracing
      # Semgrep runs: fetch their results so repo-rule IDs reach the traces (missing artifacts are fine).
      - if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Semgrep'
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D semgrep-results-dl || true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
      - run: node tracing/github-ingest.mjs
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SEMGREP_RESULTS_DIR: semgrep-results-dl
