# Semgrep AppSec Platform scan plus the repo's own rules (.semgrep/rules) on every PR. Blocking findings fail the check; the coding agent then follows
# .claude/skills/senso-lessons (look up the Senso lesson, fix, push). After SEMGREP_FAIL_LIMIT failed runs on
# one branch, the escalate job labels the PR `needs-human` and agents stop pushing fixes.
# The name must stay `Semgrep`: trace-github.yml traces completed runs of this workflow by name.
name: Semgrep

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SEMGREP_FAIL_LIMIT: 3

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # pipx, not the semgrep/semgrep container: shared runners hit Docker Hub's anonymous pull rate limit.
      - run: pipx install semgrep
      - name: Require SEMGREP_APP_TOKEN
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "::error::Repository secret SEMGREP_APP_TOKEN is not set (Semgrep AppSec Platform > Settings > Tokens)."
            exit 1
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - run: semgrep ci --json-output=semgrep-results.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  # Project rules live in .semgrep/rules (one rule + one annotated fixture per file). `semgrep ci` refuses
  # --config while logged in, so they run here as a separate scan that needs no token.
  repo-rules:
    name: semgrep/repo-rules
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pipx install semgrep
      - name: Rule fixtures match where annotated
        run: semgrep --test .semgrep/rules
      - name: Repo rules find nothing
        run: semgrep scan --config .semgrep/rules --exclude .semgrep --metrics off --error --json-output=semgrep-repo-rules-results.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-repo-rules-results
          path: semgrep-repo-rules-results.json
          if-no-files-found: ignore

  escalate:
    name: semgrep/escalate
    needs: [semgrep, repo-rules]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Count failures on the branch
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # This run is still in progress, so it is not in the failure list yet; add it.
          prior=$(gh run list --workflow Semgrep --branch "$BRANCH" --status failure --limit 100 --json databaseId --jq length)
          failures=$((prior + 1))
          echo "Semgrep failures on $BRANCH: $failures (limit $SEMGREP_FAIL_LIMIT)"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          if [ "$failures" -lt "$SEMGREP_FAIL_LIMIT" ]; then exit 0; fi
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx needs-human; then exit 0; fi
          echo "stuck=true" >> "$GITHUB_OUTPUT"
      - if: steps.count.outputs.stuck == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # policies/pr-decision/POLICY.md §1: a live coding session asks the human itself; otherwise the Guild agent does.
      - name: Decide who asks the human
        id: route
        if: steps.count.outputs.stuck == 'true'
        continue-on-error: true   # no owner output means Guild asks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          HEAD_COMMIT_MESSAGE=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq .commit.message) node tracing/route-escalation.mjs
      - name: Label PR needs-human
        if: steps.count.outputs.stuck == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FAILURES: ${{ steps.count.outputs.failures }}
          OWNER: ${{ steps.route.outputs.owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create needs-human --color B60205 --description "Agents hit the retry limit; a human must review" --force
          gh pr edit "$PR" --add-label needs-human
          gh pr comment "$PR" --body "Semgrep has failed $FAILURES times on this branch (limit $SEMGREP_FAIL_LIMIT). Agents have stopped pushing fixes. Latest run: $RUN_URL. \`${OWNER:-guild}\` will ask for a decision in Slack (policies/pr-decision/POLICY.md)."
      - name: Ask the human through the Guild agent
        if: steps.count.outputs.stuck == 'true' && !startsWith(steps.route.outputs.owner, 'session:')
        env:
          GUILD_PR_DECISION_KEY: ${{ secrets.GUILD_PR_DECISION_KEY }}
          GUILD_SESSIONS_URL: https://api.guild.ai/v1/workspaces/blueif16/sandbox/sessions
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          FAILURES: ${{ steps.count.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.semgrep.result }}
          REPO_RULES_RESULT: ${{ needs.repo-rules.result }}
        run: |
          if [ -z "$GUILD_PR_DECISION_KEY" ]; then
            echo "::warning::Repository secret GUILD_PR_DECISION_KEY is not set; nobody was asked in Slack."
            exit 0
          fi
          # Name the check(s) that actually failed so the Slack question doesn't guess.
          failed=""
          [ "$CI_RESULT" = "failure" ] && failed="semgrep/ci"
          [ "$REPO_RULES_RESULT" = "failure" ] && failed="${failed:+$failed,}semgrep/repo-rules"
          text="ESCALATE repo=$REPO pr=$PR branch=$BRANCH run_id=$RUN_ID failures=$FAILURES failed_checks=${failed:-unknown} run_url=$RUN_URL"
          jq -n --arg text "$text" '{session_type: "api_trigger", agent_input: {text: $text}}' \
            | curl -sS --fail-with-body -u "$GUILD_PR_DECISION_KEY" -H "Content-Type: application/json" -d @- "$GUILD_SESSIONS_URL"
